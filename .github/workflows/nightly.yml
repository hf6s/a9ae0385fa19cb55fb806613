name: Nightly scan + AI analysis

# NOTE: superseded by scan.yml. The scheduled cron was removed back when
# prices came from Yahoo, which blocks GitHub's datacenter IPs and made every
# CI scan fail the MIN_SURVIVORS guard. Prices now come from EODHD, which
# works from CI, so scan.yml is the maintained path. A local Task Scheduler
# job (scripts/nightly-local.ps1) also runs the scan on a workstation.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan universe and compute rankings
        run: npm run scan
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Claude analysis of top 20
        run: npm run analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "factor20-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: nightly rankings + analysis"
          git push
