name: Nightly scan + AI analysis

# NOTE: the scheduled cron was removed — Yahoo Finance blocks GitHub's
# datacenter IPs, so CI scans always fail the MIN_SURVIVORS guard. The
# nightly scan now runs locally via Windows Task Scheduler on marky's PC
# ("Factor20 nightly scan" task -> scripts/nightly-local.ps1, 7:30 PM PT
# weekdays). This workflow stays for manual runs (workflow_dispatch) in
# case a datacenter-friendly price source is added later.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan universe and compute rankings
        run: npm run scan
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Claude analysis of top 20
        run: npm run analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "factor20-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: nightly rankings + analysis"
          git push
