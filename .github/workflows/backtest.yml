name: Backtest (site-triggered)

# Replays the live scoring engine over ~10 years on point-in-time SEC data and
# EODHD prices, including companies that later delisted.
on:
  workflow_dispatch:
    inputs:
      wide:
        description: "Test the full liquid US universe (~4,500 incl. delisted) instead of the S&P 500"
        required: false
        default: false
        type: boolean
      top:
        description: "Holdings per rebalance (blank = 20)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: factor20-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The SEC filing cache is gitignored and costs ~30 min to rebuild, so it
      # is restored between runs rather than refetched every time.
      - name: Restore SEC filings cache
        uses: actions/cache@v4
        with:
          path: |
            data/edgar-history-cache.json
            data/cik-map.json
            data/sp500-membership.json
            data/delisted-cik-cache.json
          key: factor20-edgar-${{ github.run_id }}
          restore-keys: factor20-edgar-

      - name: Backtest
        run: npm run backtest -- ${{ inputs.wide && '--wide' || '' }} ${{ inputs.top && format('--top {0}', inputs.top) || '' }}
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          # SEC rejects placeholder contacts with a 403. Must be a real address.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}

      - name: Commit updated backtest
        run: |
          git config user.name "factor20-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet || git commit -m "data: backtest"
          git pull --rebase --autostash
          git push

      - name: Trigger Vercel rebuild
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null
